<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Online Voting System</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --primary: #004680;
            --accent: #007bff;
            --bg-blue: #0084ff;
            --text-dark: #333;
            --text-light: #fff;
            --input-bg: #f3f4f6;
        }

        :root {
            --primary: #004680;
            --accent: #007bff;
            --bg-blue: #0084ff;
            --text-dark: #333;
            --text-light: #fff;
            --input-bg: #f3f4f6;
        }

        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: #0056b3;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .main-container {
            background: white;
            width: 900px;
            height: 600px;
            border-radius: 30px;
            display: flex;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            position: relative;
        }

        /* Left Branding Side */
        .branding {
            flex: 1;
            background: var(--bg-blue);
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 60px;
            color: white;
            overflow: hidden;
        }

        .branding h1 {
            font-size: 48px;
            font-weight: 700;
            margin: 0;
            letter-spacing: 2px;
        }

        .branding h2 {
            font-size: 20px;
            font-weight: 500;
            margin: 10px 0 20px;
            opacity: 0.9;
        }

        .branding p {
            font-size: 13px;
            line-height: 1.6;
            opacity: 0.8;
            max-width: 300px;
        }

        /* Abstract Shapes */
        .shape {
            position: absolute;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.2) 0%, rgba(255, 255, 255, 0) 100%);
        }

        .shape-1 {
            width: 400px;
            height: 400px;
            top: -100px;
            left: -100px;
        }

        .shape-2 {
            width: 300px;
            height: 300px;
            bottom: -50px;
            right: -100px;
            background: rgba(0, 0, 0, 0.1);
        }

        /* Right Side */
        .dashboard-side {
            flex: 1.2;
            padding: 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: white;
        }

        .dashboard-side h2 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 10px;
            color: var(--text-dark);
        }

        .dashboard-side p {
            color: #888;
            font-size: 14px;
            margin-bottom: 40px;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        button {
            width: 100%;
            padding: 16px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
        }

        .btn-vote {
            background: var(--primary);
            color: white;
        }

        .btn-vote:hover {
            background: #003366;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 70, 128, 0.2);
        }

        .btn-result {
            background: white;
            color: var(--primary);
            border: 2px solid var(--primary);
        }

        .btn-result:hover {
            background: #f0f7ff;
            transform: translateY(-2px);
        }

        .logout {
            background: #fff5f5;
            color: #ef4444;
            border: 2px solid #fee2e2;
            margin-top: 10px;
        }

        .logout:hover {
            background: #ef4444;
            color: white;
            border-color: #ef4444;
        }

        a {
            text-decoration: none;
            width: 100%;
        }

        /* Language Switcher Style */
        .lang-switcher {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            background: white;
            padding: 5px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            display: flex;
            gap: 5px;
        }

        .lang-btn {
            padding: 8px 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
            background: transparent;
            color: var(--text-dark);
        }

        .lang-btn.active {
            background: var(--primary);
            color: white;
        }
    </style>

    <div class="lang-switcher">
        <button class="lang-btn active" onclick="switchLang('en')" id="enBtn">EN</button>
        <button class="lang-btn" onclick="switchLang('mr')" id="mrBtn">MR</button>
    </div>

    <div class="main-container">
        <div class="branding">
            <div class="shape shape-1"></div>
            <div class="shape shape-2"></div>
            <h1 data-i18n="hello">HELLO</h1>
            <h2 data-i18n="welcome-voter">WELCOME BACK VOTER</h2>
            <p data-i18n="dashboard-desc">Access your voter profile, cast your ballot, and view election results all in
                one secure place.</p>
        </div>

        <div class="dashboard-side">
            <h2 data-i18n="dashboard">Dashboard</h2>
            <p data-i18n="select-option">Select an option to continue</p>

            <div class="btn-group">
                <a href="vote.html">
                    <button class="btn-vote" data-i18n="vote-now">Vote Now</button>
                </a>

                <a href="result.html">
                    <button class="btn-result" data-i18n="view-results">View Results</button>
                </a>

                <a href="login.html">
                    <button class="logout" data-i18n="logout">Logout</button>
                </a>
            </div>
        </div>
    </div>

    <script>
        const translations = {
            en: {
                hello: "HELLO",
                "welcome-voter": "WELCOME BACK VOTER",
                "dashboard-desc": "Access your voter profile, cast your ballot, and view election results all in one secure place.",
                dashboard: "Dashboard",
                "select-option": "Select an option to continue",
                "vote-now": "Vote Now",
                "view-results": "View Results",
                logout: "Logout"
            },
            mr: {
                hello: "नमस्कार",
                "welcome-voter": "तुमचे स्वागत आहे",
                "dashboard-desc": "तुमची प्रोफाइल पहा, मतदान करा आणि निवडणुकीचे निकाल एकाच ठिकाणी पहा.",
                dashboard: "डॅशबोर्ड",
                "select-option": "सुरू ठेवण्यासाठी एक पर्याय निवडा",
                "vote-now": "आता मतदान करा",
                "view-results": "निकाल पहा",
                logout: "बाहेर पडा"
            }
        };

        function switchLang(lang) {
            localStorage.setItem('voterLang', lang);
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                el.innerText = translations[lang][key];
            });
            document.getElementById('enBtn').classList.toggle('active', lang === 'en');
            document.getElementById('mrBtn').classList.toggle('active', lang === 'mr');
        }

        window.onload = () => {
            const savedLang = localStorage.getItem('voterLang') || 'en';
            switchLang(savedLang);
        };
    </script>

</html>
