<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <style>
        :root {
            --primary: #004680;
            --accent: #007bff;
            --bg-blue: #0084ff;
            --text-dark: #333;
            --text-light: #fff;
            --input-bg: #f3f4f6;
        }

        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: #0056b3;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Language Switcher Style */
        .lang-switcher {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            background: white;
            padding: 5px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            display: flex;
            gap: 5px;
        }

        .lang-btn {
            padding: 8px 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
            background: transparent;
            color: var(--text-dark);
        }

        .lang-btn.active {
            background: var(--primary);
            color: white;
        }

        .main-container {
            background: white;
            width: 900px;
            height: 600px;
            border-radius: 30px;
            display: flex;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            position: relative;
        }

        /* Left Branding Side */
        .branding {
            flex: 1;
            background: var(--bg-blue);
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 60px;
            color: white;
            overflow: hidden;
        }

        .branding h1 {
            font-size: 48px;
            font-weight: 700;
            margin: 0;
            letter-spacing: 2px;
        }

        .branding h2 {
            font-size: 20px;
            font-weight: 500;
            margin: 10px 0 20px;
            opacity: 0.9;
        }

        .branding p {
            font-size: 13px;
            line-height: 1.6;
            opacity: 0.8;
            max-width: 300px;
        }

        /* Abstract Shapes */
        .shape {
            position: absolute;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.2) 0%, rgba(255, 255, 255, 0) 100%);
        }

        .shape-1 {
            width: 400px;
            height: 400px;
            top: -100px;
            left: -100px;
        }

        .shape-2 {
            width: 300px;
            height: 300px;
            bottom: -50px;
            right: -100px;
            background: rgba(0, 0, 0, 0.1);
        }

        .shape-3 {
            width: 200px;
            height: 200px;
            bottom: 50px;
            left: -50px;
            background: var(--accent);
            opacity: 0.5;
        }

        /* Right Form Side */
        .form-side {
            flex: 1.2;
            padding: 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: white;
        }

        .form-side h2 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 10px;
            color: var(--text-dark);
        }

        .form-side p {
            color: #888;
            font-size: 14px;
            margin-bottom: 40px;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        .input-group i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #666;
        }

        .input-group input {
            width: 100%;
            padding: 15px 15px 15px 45px;
            border: none;
            background: var(--input-bg);
            border-radius: 12px;
            font-size: 14px;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            background: #e5e7eb;
            outline: none;
            box-shadow: 0 0 0 2px var(--accent);
        }

        .show-pass {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 12px;
            font-weight: 600;
            color: var(--primary);
            cursor: pointer;
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            font-size: 13px;
            color: #666;
        }

        .form-options a {
            text-decoration: none;
            color: var(--accent);
        }

        .btn-primary {
            width: 100%;
            padding: 15px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }

        .btn-primary:hover {
            background: #003366;
            transform: translateY(-2px);
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin-bottom: 20px;
            color: #aaa;
            font-size: 12px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #eee;
        }

        .divider:not(:empty)::before {
            margin-right: 10px;
        }

        .divider:not(:empty)::after {
            margin-left: 10px;
        }

        .btn-secondary {
            width: 100%;
            padding: 15px;
            background: white;
            color: var(--text-dark);
            border: 2px solid #ddd;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-secondary:hover {
            background: #f9f9f9;
            border-color: #bbb;
        }

        .footer-link {
            text-align: center;
            margin-top: 30px;
            font-size: 13px;
            color: #666;
        }

        .footer-link a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>

<body>

    <div class="lang-switcher">
        <button class="lang-btn active" onclick="switchLang('en')" id="enBtn">EN</button>
        <button class="lang-btn" onclick="switchLang('mr')" id="mrBtn">MR</button>
    </div>

    <div class="main-container">
        <!-- Left Side -->
        <div class="branding">
            <div class="shape shape-1"></div>
            <div class="shape shape-2"></div>
            <div class="shape shape-3"></div>

            <h1 data-i18n="welcome">WELCOME</h1>
            <h2 data-i18n="headline">YOUR HEADLINE NAME</h2>
            <p data-i18n="welcome-desc">Your voice matters. Participate in the democratic process and shape the future
                by casting your secure vote today.</p>
        </div>

        <!-- Right Side -->
        <div class="form-side">
            <h2 data-i18n="signin">Sign in</h2>
            <p data-i18n="signin-sub">Please sign in with your Voter ID to access the voting dashboard.</p>

            <form id="loginForm">
                <div class="input-group">
                    <i>👤</i>
                    <input type="text" id="loginVoterId" data-i18n-placeholder="username" placeholder="Voter ID"
                        required>
                </div>

                <div class="input-group">
                    <i>🔒</i>
                    <input type="password" id="passInput" data-i18n-placeholder="password" placeholder="Password"
                        required>
                    <span class="show-pass" onclick="togglePass()" data-i18n="show">SHOW</span>
                </div>

                <div class="form-options">
                    <label><input type="checkbox" style="width: auto; margin-right: 5px;"> <span
                            data-i18n="remember">Remember me</span></label>
                    <a href="#" data-i18n="forgot">Forgot Password?</a>
                </div>

                <button type="submit" class="btn-primary" data-i18n="signin-btn">Sign in</button>

                <div class="divider" data-i18n="or">Or</div>

                <div id="googleBtnContainer" style="width: 100%; display: flex; justify-content: center;">
                    <div id="g_id_onload" data-client_id="your_google_client_id_here" data-context="signin"
                        data-ux_mode="popup" data-callback="handleCredentialResponse" data-auto_prompt="false">
                    </div>
                    <div class="g_id_signin" data-type="standard" data-shape="rectangular" data-theme="outline"
                        data-text="signin_with" data-size="large" data-logo_alignment="left" data-width="380">
                    </div>
                </div>

                <div class="footer-link">
                    <span data-i18n="no-account">Don't have an account?</span> <a href="register.html"
                        data-i18n="signup">Sign Up</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        const translations = {
            en: {
                welcome: "WELCOME",
                headline: "Digital Democracy",
                "welcome-desc": "Your voice matters. Participate in the democratic process and shape the future by casting your secure vote today.",
                signin: "Sign in",
                "signin-sub": "Please sign in with your Voter ID to access the voting dashboard.",
                username: "Voter ID",
                password: "Password",
                show: "SHOW",
                hide: "HIDE",
                remember: "Remember me",
                forgot: "Forgot Password?",
                "signin-btn": "Sign in",
                or: "Or",
                "signin-other": "Sign in with other",
                "no-account": "Don't have an account?",
                signup: "Sign Up"
            },
            mr: {
                welcome: "स्वागत आहे",
                headline: "तुमचे मुख्य नाव",
                "welcome-desc": "लोकशाही प्रक्रियेत सहभागी व्हा आणि मतदान करा. तुमचे मत हेच तुमचे भविष्य आहे.",
                signin: "साइन इन करा",
                "signin-sub": "कृपया आपले तपशील प्रविष्ट करा",
                username: "मतदार ओळखपत्र",
                password: "पासवर्ड",
                show: "दाखवा",
                hide: "लपवा",
                remember: "माझी आठवण ठेवा",
                forgot: "पासवर्ड विसरलात?",
                "signin-btn": "साइन इन करा",
                or: "किंवा",
                "signin-other": "इतर पर्यायाने साइन इन करा",
                "no-account": "खाते नाही?",
                signup: "नोंदणी करा"
            }
        };

        function switchLang(lang) {
            localStorage.setItem('voterLang', lang);
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                el.innerText = translations[lang][key];
            });

            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                el.placeholder = translations[lang][key];
            });

            // Update buttons
            document.getElementById('enBtn').classList.toggle('active', lang === 'en');
            document.getElementById('mrBtn').classList.toggle('active', lang === 'mr');
        }

        // Initialize Language
        window.onload = () => {
            const savedLang = localStorage.getItem('voterLang') || 'en';
            switchLang(savedLang);
        };

        function togglePass() {
            const pass = document.getElementById('passInput');
            const toggle = document.querySelector('.show-pass');
            const lang = localStorage.getItem('voterLang') || 'en';
            if (pass.type === 'password') {
                pass.type = 'text';
                toggle.innerText = translations[lang]['hide'];
            } else {
                pass.type = 'password';
                toggle.innerText = translations[lang]['show'];
            }
        }

        document.getElementById('loginForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            console.log("Login started...");
            const voter_id = document.getElementById('loginVoterId').value;
            const password = document.getElementById('passInput').value;

            try {
                const response = await fetch('http://localhost:3000/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ voter_id, password })
                });

                const result = await response.json();
                console.log("Login Response:", result);
                if (response.ok) {
                    localStorage.setItem('currentUser', JSON.stringify(result.user));
                    window.location.href = "dashboard.html";
                } else {
                    alert(result.message);
                }
            } catch (err) {
                console.error("Login Fetch Error:", err);
                alert("Server error. Please make sure the backend is running.");
            }
        });

        async function handleCredentialResponse(response) {
            console.log("Google Token Received");
            try {
                const res = await fetch('http://localhost:3000/api/google-login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: response.credential })
                });

                const result = await res.json();
                console.log("Google Login Response:", result);
                if (res.ok) {
                    localStorage.setItem('currentUser', JSON.stringify(result.user));
                    window.location.href = "dashboard.html";
                } else {
                    alert(result.message || "Google Sign-In failed");
                }
            } catch (err) {
                console.error("Google Login Error:", err);
                alert("Error connecting to server for Google Sign-In.");
            }
        }
    </script>

</body>

</html>
