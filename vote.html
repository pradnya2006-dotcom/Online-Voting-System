<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vote - Online Voting System</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #004680;
      --accent: #007bff;
      --bg-blue: #0084ff;
      --success: #10b981;
      --text-dark: #333;
      --text-light: #fff;
      --input-bg: #f3f4f6;
    }

    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: #0056b3;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .main-container {
      background: white;
      width: 1000px;
      height: 650px;
      border-radius: 30px;
      display: flex;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.2);
      overflow: hidden;
      position: relative;
    }

    /* Left Branding Side */
    .branding {
      flex: 1;
      background: var(--bg-blue);
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 60px;
      color: white;
      overflow: hidden;
    }

    .branding h1 {
      font-size: 48px;
      font-weight: 700;
      margin: 0;
      letter-spacing: 2px;
    }

    .branding h2 {
      font-size: 20px;
      font-weight: 500;
      margin: 10px 0 20px;
      opacity: 0.9;
    }

    .branding p {
      font-size: 13px;
      line-height: 1.6;
      opacity: 0.8;
      max-width: 300px;
    }

    /* Abstract Shapes */
    .shape {
      position: absolute;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.2) 0%, rgba(255, 255, 255, 0) 100%);
    }

    .shape-1 {
      width: 400px;
      height: 400px;
      top: -100px;
      left: -100px;
    }

    .shape-2 {
      width: 300px;
      height: 300px;
      bottom: -50px;
      right: -100px;
      background: rgba(0, 0, 0, 0.1);
    }

    /* Right Side */
    .vote-side {
      flex: 1.2;
      padding: 60px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background: white;
    }

    .vote-side h2 {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 10px;
      color: var(--text-dark);
    }

    .vote-side p {
      color: #888;
      font-size: 14px;
      margin-bottom: 30px;
    }

    .candidate-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .candidate {
      background: var(--input-bg);
      padding: 16px 24px;
      border-radius: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.3s ease;
      border: 2px solid transparent;
    }

    .candidate:hover {
      background: #f0f7ff;
      border-color: var(--accent);
      transform: translateX(5px);
    }

    .candidate span {
      font-weight: 600;
      color: var(--text-dark);
    }

    .vote-btn {
      padding: 10px 20px;
      background: var(--success);
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .vote-btn:hover {
      background: #059669;
      transform: scale(1.05);
    }

    .vote-btn:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    .already-voted {
      display: none;
      background: #fff4f4;
      color: #d32f2f;
      padding: 15px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 500;
      text-align: center;
      margin-bottom: 20px;
    }

    .back-btn {
      margin-top: 30px;
      padding: 14px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
    }

    .back-btn:hover {
      background: #003366;
    }
  </style>
</head>

<body>

  <style>
    /* Language Switcher Style */
    .lang-switcher {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1000;
      background: white;
      padding: 5px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      display: flex;
      gap: 5px;
    }

    .lang-btn {
      padding: 8px 15px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: 0.3s;
      background: transparent;
      color: var(--text-dark);
    }

    .lang-btn.active {
      background: var(--primary);
      color: white;
    }
  </style>

  <div class="lang-switcher">
    <button class="lang-btn active" onclick="switchLang('en')" id="enBtn">EN</button>
    <button class="lang-btn" onclick="switchLang('mr')" id="mrBtn">MR</button>
  </div>

  <div class="main-container">
    <div class="branding">
      <div class="shape shape-1"></div>
      <div class="shape shape-2"></div>
      <h1 data-i18n="vote">VOTE</h1>
      <h2 data-i18n="cast">CAST YOUR BALLOT</h2>
      <p data-i18n="vote-desc">Your vote is your voice. Select your preferred candidate carefully. Remember, you can
        only vote once.</p>
    </div>

    <div class="vote-side">
      <h2 data-i18n="select">Select Candidate</h2>
      <p id="sub-title" data-i18n="choose">Choose one option below</p>

      <div id="votedMessage" class="already-voted" data-i18n="already-voted">
        ⚠️ You have already cast your vote! Multiple voting is not allowed.
      </div>

      <div class="candidate-list" id="candidateList">
        <div class="candidate">
          <span>Candidate 1</span>
          <button class="vote-btn" onclick="castVote('Candidate 1')" data-i18n="vote-btn">Vote</button>
        </div>
        <div class="candidate">
          <span>Candidate 2</span>
          <button class="vote-btn" onclick="castVote('Candidate 2')" data-i18n="vote-btn">Vote</button>
        </div>
        <div class="candidate">
          <span>Candidate 3</span>
          <button class="vote-btn" onclick="castVote('Candidate 3')" data-i18n="vote-btn">Vote</button>
        </div>
      </div>

      <a href="dashboard.html" class="back-btn" data-i18n="back">Back to Dashboard</a>
    </div>
  </div>

  <script>
    const translations = {
      en: {
        vote: "VOTE",
        cast: "CAST YOUR BALLOT",
        "vote-desc": "Your vote is your voice. Select your preferred candidate carefully. Remember, you can only vote once.",
        select: "Select Candidate",
        choose: "Choose one option below",
        "already-voted": "⚠️ You have already cast your vote! Multiple voting is not allowed.",
        "vote-btn": "Vote",
        back: "Back to Dashboard",
        verified: "Voter Status Verified",
        confirm: "Are you sure you want to vote for ",
        thanks: "Thank you! Your vote for {candidate} has been cast.",
        already_alert: "You have already voted!"
      },
      mr: {
        vote: "मतदान",
        cast: "तुमचे मत द्या",
        "vote-desc": "तुमचे मत हे तुमचे सामर्थ्य आहे. कृपया आपला उमेदवार काळजीपूर्वक निवडा. लक्षात ठेवा, तुम्ही फक्त एकदाच मतदान करू शकता.",
        select: "उमेदवार निवडा",
        choose: "खालीलपैकी एक पर्याय निवडा",
        "already-voted": "⚠️ तुम्ही आधीच मतदान केले आहे! एकापेक्षा जास्त वेळा मतदान करण्याची परवानगी नाही.",
        "vote-btn": "मत द्या",
        back: "डॅशबोर्डवर परत जा",
        verified: "मतदार स्थिती सत्यापित",
        confirm: "तुमची खात्री आहे का की तुम्हाला मतदान करायचे आहे? उमेदवार: ",
        thanks: "धन्यवाद! तुमचे {candidate} साठीचे मत नोंदवले गेले आहे.",
        already_alert: "तुम्ही आधीच मतदान केले आहे!"
      }
    };

    function switchLang(lang) {
      localStorage.setItem('voterLang', lang);
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        el.innerText = translations[lang][key];
      });

      // Update status if already voted
      if (localStorage.getItem('hasVoted')) {
        document.getElementById('sub-title').innerText = translations[lang]['verified'];
      }

      document.getElementById('enBtn').classList.toggle('active', lang === 'en');
      document.getElementById('mrBtn').classList.toggle('active', lang === 'mr');
    }

    window.onload = function () {
      const savedLang = localStorage.getItem('voterLang') || 'en';
      switchLang(savedLang);

      const user = JSON.parse(localStorage.getItem('currentUser'));
      if (!user) {
        window.location.href = "login.html";
        return;
      }

      if (user.has_voted) {
        disableVoting();
      }
    };

    function disableVoting() {
      const lang = localStorage.getItem('voterLang') || 'en';
      const btns = document.querySelectorAll('.vote-btn');
      btns.forEach(btn => btn.disabled = true);
      document.getElementById('votedMessage').style.display = 'block';
      document.getElementById('sub-title').innerText = translations[lang]['verified'];
    }

    async function castVote(candidate) {
      const lang = localStorage.getItem('voterLang') || 'en';
      const user = JSON.parse(localStorage.getItem('currentUser'));

      const confirmVote = confirm(translations[lang].confirm + candidate + "?");
      if (confirmVote) {
        try {
          const response = await fetch('http://localhost:3000/api/vote', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              voter_id: user.voter_id,
              candidate_name: candidate
            })
          });

          const result = await response.json();
          if (response.ok) {
            alert(translations[lang].thanks.replace('{candidate}', candidate));
            // Update local user state
            user.has_voted = true;
            localStorage.setItem('currentUser', JSON.stringify(user));
            window.location.href = "result.html";
          } else {
            alert(result.message);
          }
        } catch (err) {
          console.error(err);
          alert("Server error. Please make sure the backend is running.");
        }
      }
    }
  </script>

</body>

</html>
