<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Voting System - Register</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --primary: #004680;
            --accent: #007bff;
            --bg-blue: #0084ff;
            --text-dark: #333;
            --text-light: #fff;
            --input-bg: #f3f4f6;
        }

        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: #0056b3;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .main-container {
            background: white;
            width: 1000px;
            height: 700px;
            border-radius: 30px;
            display: flex;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            position: relative;
        }

        /* Left Branding Side */
        .branding {
            flex: 1;
            background: var(--bg-blue);
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 60px;
            color: white;
            overflow: hidden;
        }

        .branding h1 {
            font-size: 48px;
            font-weight: 700;
            margin: 0;
            letter-spacing: 2px;
        }

        .branding h2 {
            font-size: 20px;
            font-weight: 500;
            margin: 10px 0 20px;
            opacity: 0.9;
        }

        .branding p {
            font-size: 13px;
            line-height: 1.6;
            opacity: 0.8;
            max-width: 300px;
        }

        /* Abstract Shapes */
        .shape {
            position: absolute;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.2) 0%, rgba(255, 255, 255, 0) 100%);
        }

        .shape-1 {
            width: 400px;
            height: 400px;
            top: -100px;
            left: -100px;
        }

        .shape-2 {
            width: 300px;
            height: 300px;
            bottom: -50px;
            right: -100px;
            background: rgba(0, 0, 0, 0.1);
        }

        .shape-3 {
            width: 200px;
            height: 200px;
            bottom: 50px;
            left: -50px;
            background: var(--accent);
            opacity: 0.5;
        }

        /* Right Form Side */
        .form-side {
            flex: 1.2;
            padding: 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: white;
            overflow-y: auto;
        }

        .form-side h2 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 10px;
            color: var(--text-dark);
        }

        .form-side p {
            color: #888;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .input-group {
            position: relative;
            margin-bottom: 15px;
        }

        .input-group i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #666;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px 12px 45px;
            border: none;
            background: var(--input-bg);
            border-radius: 12px;
            font-size: 14px;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            background: #e5e7eb;
            outline: none;
            box-shadow: 0 0 0 2px var(--accent);
        }

        .btn-primary {
            width: 100%;
            padding: 15px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            margin-bottom: 20px;
        }

        .btn-primary:hover {
            background: #003366;
            transform: translateY(-2px);
        }

        .footer-link {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #666;
        }

        .footer-link a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
        }

        /* Language Switcher Style */
        .lang-switcher {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            background: white;
            padding: 5px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            display: flex;
            gap: 5px;
        }

        .lang-btn {
            padding: 8px 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
            background: transparent;
            color: var(--text-dark);
        }

        .lang-btn.active {
            background: var(--primary);
            color: white;
        }
    </style>
</head>

<body>

    <div class="lang-switcher">
        <button class="lang-btn active" onclick="switchLang('en')" id="enBtn">EN</button>
        <button class="lang-btn" onclick="switchLang('mr')" id="mrBtn">MR</button>
    </div>

    <div class="main-container">
        <!-- Left Side -->
        <div class="branding">
            <div class="shape shape-1"></div>
            <div class="shape shape-2"></div>

            <div class="shape shape-3"></div>

            <h1 data-i18n="join">JOIN US</h1>
            <h2 data-i18n="headline">YOUR HEADLINE NAME</h2>
            <p data-i18n="join-desc">Secure your vote and participate in the democratic process. Register today to make
                your voice heard in the upcoming elections.</p>
        </div>

        <!-- Right Side -->
        <div class="form-side">
            <h2 data-i18n="create">Create Account</h2>
            <p data-i18n="create-sub">Please fill in the details below</p>

            <form id="registerForm">
                <div class="input-group">
                    <i>👤</i>
                    <input type="text" id="fullName" data-i18n-placeholder="fullname" placeholder="Full Name" required>
                </div>

                <div class="input-group">
                    <i>✉️</i>
                    <input type="email" id="email" data-i18n-placeholder="email" placeholder="Email Address" required>
                </div>

                <div class="input-group">
                    <i>🆔</i>
                    <input type="text" id="voterId" data-i18n-placeholder="voterid"
                        placeholder="Voter ID (10 alphanumeric)" pattern="[a-zA-Z0-9]{10}" maxlength="10"
                        title="Voter ID must be exactly 10 alphanumeric characters" required>
                </div>

                <div class="input-group">
                    <i>🔒</i>
                    <input type="password" id="pass" data-i18n-placeholder="createpass" placeholder="Create Password"
                        minlength="6" required>
                </div>

                <div class="input-group">
                    <i>🔒</i>
                    <input type="password" id="confirmPass" data-i18n-placeholder="confirmpass"
                        placeholder="Confirm Password" required>
                </div>

                <button type="submit" id="regBtn" class="btn-primary" data-i18n="register-btn">Register Now</button>

                <div class="footer-link">
                    <span data-i18n="has-account">Already have an account?</span> <a href="login.html"
                        data-i18n="signin-link">Sign In</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        // ... (translations and switchLang remain same)
        const translations = {
            en: {
                join: "JOIN US",
                headline: "Digital Democracy",
                "join-desc": "Secure your vote and participate in the democratic process. Register today to make your voice heard in the upcoming elections.",
                create: "Create Account",
                "create-sub": "Please fill in the details below",
                fullname: "Full Name",
                email: "Email Address",
                voterid: "Voter ID (10 alphanumeric)",
                createpass: "Create Password",
                confirmpass: "Confirm Password",
                "register-btn": "Register Now",
                "has-account": "Already have an account?",
                "signin-link": "Sign In",
                voterid_alert: "Voter ID must be exactly 10 alphanumeric characters!",
                match_alert: "Passwords do not match!",
                success_alert: "Registration Successful! Please login to continue.",
                processing: "Processing..."
            },
            mr: {
                join: "आमच्याशी जोडा",
                headline: "तुमचे मुख्य नाव",
                "join-desc": "तुमचे मत सुरक्षित करा आणि लोकशाही प्रक्रियेत सहभागी व्हा. आजच नोंदणी करा आणि निवडणुकांमध्ये आपला आवाज बुलंद करा.",
                create: "खाते तयार करा",
                "create-sub": "कृपया खालील तपशील भरा",
                fullname: "पूर्ण नाव",
                email: "ईमेल पत्ता",
                voterid: "मतदार ओळखपत्र (१० अक्षरी)",
                createpass: "पासवर्ड तयार करा",
                confirmpass: "पासवर्डची पुष्टी करा",
                "register-btn": "आता नोंदणी करा",
                "has-account": "आधीच खाते आहे?",
                "signin-link": "साइन इन करा",
                voterid_alert: "मतदार ओळखपत्र नेमके १० अक्षरी असावे!",
                match_alert: "पासवर्ड जुळत नाहीत!",
                success_alert: "नोंदणी यशस्वी! कृपया सुरू ठेवण्यासाठी लॉग इन करा.",
                processing: "प्रक्रिया सुरू आहे..."
            }
        };

        function switchLang(lang) {
            if (!translations[lang]) lang = 'en';
            localStorage.setItem('voterLang', lang);
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang][key]) el.innerText = translations[lang][key];
            });

            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (translations[lang][key]) el.placeholder = translations[lang][key];
            });

            if (document.getElementById('enBtn')) document.getElementById('enBtn').classList.toggle('active', lang === 'en');
            if (document.getElementById('mrBtn')) document.getElementById('mrBtn').classList.toggle('active', lang === 'mr');
        }

        window.onload = () => {
            const savedLang = localStorage.getItem('voterLang') || 'en';
            switchLang(savedLang);
        };

        document.getElementById('registerForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            try {
                const lang = localStorage.getItem('voterLang') || 'en';
                const safeLang = translations[lang] ? lang : 'en';
                const btn = document.getElementById('regBtn');

                const fullNameEl = document.getElementById('fullName');
                const emailEl = document.getElementById('email');
                const voterIdEl = document.getElementById('voterId');
                const passEl = document.getElementById('pass');
                const confirmPassEl = document.getElementById('confirmPass');

                if (!fullNameEl || !emailEl || !voterIdEl || !passEl || !confirmPassEl) {
                    alert("Critical Error: Some form fields are missing. Please refresh the page.");
                    return;
                }

                const formData = {
                    full_name: fullNameEl.value,
                    email: emailEl.value,
                    voter_id: voterIdEl.value,
                    password: passEl.value,
                    confirmPass: confirmPassEl.value
                };

                const voterIdPattern = /^[a-zA-Z0-9]{10}$/;
                if (!voterIdPattern.test(formData.voter_id)) {
                    alert(translations[safeLang].voterid_alert);
                    return;
                }

                if (formData.password !== formData.confirmPass) {
                    alert(translations[safeLang].match_alert);
                    return;
                }

                btn.disabled = true;
                btn.innerText = translations[safeLang].processing;

                const response = await fetch('http://localhost:3000/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });

                const result = await response.json();
                if (response.ok) {
                    alert(translations[safeLang].success_alert);
                    window.location.href = "login.html";
                } else {
                    alert(result.message || "Registration failed");
                    btn.disabled = false;
                    btn.innerText = translations[safeLang]['register-btn'];
                }
            } catch (err) {
                console.error("Registration Error:", err);
                alert("Unable to connect to the server. Please ensure the backend (node server.js) is running.");
                const btn = document.getElementById('regBtn');
                if (btn) {
                    btn.disabled = false;
                    const lang = localStorage.getItem('voterLang') || 'en';
                    btn.innerText = translations[lang] ? translations[lang]['register-btn'] : "Register Now";
                }
            }
        });
    </script>

</body>

</html>
